<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="login_title">Bizzmind</title>
<script src="/static/i18n/core.js"></script>
<script src="/static/i18n/site.js"></script>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --navy-deep: #04142c; --navy: #082042;
    --cyan: #0ADDF5; --grad-cyan: linear-gradient(135deg, #08c4da, #0ADDF5);
    --surface-1: rgba(255,255,255,0.045);
    --text-primary: #f2f7fc; --text-secondary: #b6c8dc; --text-muted: #7d92ab;
    --border: rgba(255,255,255,0.08); --border-glow: rgba(10,221,245,0.35);
    --glow: 0 0 40px rgba(10,221,245,0.10);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(10,221,245,0.12), transparent 60%),
      linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
    color: var(--text-primary);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased; padding: 24px;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 20px; padding: 38px;
    backdrop-filter: blur(10px); box-shadow: var(--glow);
    text-align: center;
  }
  .card img { height: 52px; margin-bottom: 14px; filter: drop-shadow(0 0 18px rgba(10,221,245,0.45)); }
  .card h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .card h1 em { font-style: normal; background: var(--grad-cyan); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card p.sub { color: var(--text-muted); font-size: 13px; margin: 6px 0 26px; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 12px;
    background: rgba(255,255,255,0.05); color: var(--text-primary);
  }
  .field input:focus { outline: none; border-color: var(--border-glow); box-shadow: var(--glow); }
  #err { color: #e66767; font-size: 12.5px; min-height: 18px; margin: 4px 0 10px; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: var(--grad-cyan); color: var(--navy-deep);
    font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 24px rgba(10,221,245,0.3);
    transition: transform .15s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: .5; }
  .back { display: inline-block; margin-top: 18px; font-size: 12.5px; color: var(--text-muted); text-decoration: none; }
  .back:hover { color: var(--cyan); }
  .card .langswitch { position: absolute; top: 14px; right: 14px; }
  .card { position: relative; }
  .link { background: none; border: none; color: var(--cyan, #0ADDF5); font: inherit; font-size: 12.5px; cursor: pointer; margin-top: 10px; text-decoration: underline; }
  #ok { font-size: 12.5px; color: #8fd18f; margin: 8px 0; }
</style>
</head>
<body>
  <form class="card" id="f">
    <span class="langswitch"></span>
    <img src="/static/icon.svg" alt="Bizzmind">
    <h1>Bizz<em>mind</em></h1>
    <p class="sub" data-i18n="login_sub"></p>
    <div class="field">
      <label for="email" data-i18n="login_email"></label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field" id="namefield" style="display:none;">
      <label for="name" data-i18n="login_name"></label>
      <input id="name" type="text" autocomplete="name">
    </div>
    <div class="field">
      <label for="password" data-i18n="login_password"></label>
      <input id="password" type="password" autocomplete="current-password" required minlength="8">
    </div>
    <div id="err"></div>
    <div id="ok" style="display:none;"></div>
    <button id="btn" type="submit" data-i18n="login_btn"></button>
    <button id="toggle" type="button" class="link" data-i18n="login_to_register"></button>
    <a class="back" href="/" data-i18n="login_back"></a>
  </form>
<script>
let mode = 'login';
const $ = (id) => document.getElementById(id);
function render() {
  const reg = mode === 'register';
  $('namefield').style.display = reg ? '' : 'none';
  $('btn').textContent = t(reg ? 'register_btn' : 'login_btn');
  $('toggle').textContent = t(reg ? 'login_to_login' : 'login_to_register');
  document.querySelector('.sub').textContent = t(reg ? 'register_sub' : 'login_sub');
  $('password').autocomplete = reg ? 'new-password' : 'current-password';
  $('err').textContent = ''; $('ok').style.display = 'none';
}
$('toggle').addEventListener('click', () => { mode = mode === 'login' ? 'register' : 'login'; render(); });
document.addEventListener('DOMContentLoaded', render);
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('btn'), err = $('err'), ok = $('ok');
  btn.disabled = true; err.textContent = ''; ok.style.display = 'none';
  try {
    const body = { email: $('email').value, password: $('password').value };
    if (mode === 'register') body.name = $('name').value;
    const res = await fetch(mode === 'register' ? '/api/auth/register' : '/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || t('login_failed'));
    if (mode === 'register' && !data.confirmed) {
      ok.textContent = data.message; ok.style.display = ''; mode = 'login'; render(); ok.style.display = '';
      btn.disabled = false; return;
    }
    location.href = '/app';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
